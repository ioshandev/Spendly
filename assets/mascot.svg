<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2867FF"/>
      <stop offset="1" stop-color="#792BFF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Shadow -->
  <ellipse cx="100" cy="175" rx="45" ry="8" fill="#000" opacity="0.15">
    <animate attributeName="rx" values="45;40;45" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.1;0.15" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Body bounce -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="2s" repeatCount="indefinite"/>
    
    <!-- Main body (rounded coin shape) -->
    <circle cx="100" cy="100" r="60" fill="url(#body)"/>
    <circle cx="100" cy="100" r="60" fill="url(#shine)"/>
    
    <!-- S letter -->
    <path d="M120,75 C120,75 110,70 100,70 C85,70 75,80 75,90 C75,100 85,105 95,105 C105,105 115,100 115,90" 
          fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <path d="M80,125 C80,125 90,130 100,130 C115,130 125,120 125,110 C125,100 115,95 105,95 C95,95 85,100 85,110" 
          fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Eyes -->
    <g>
      <circle cx="82" cy="95" r="7" fill="#fff">
        <animate attributeName="ry" values="7;1;7;7;7" dur="4s" repeatCount="indefinite" begin="1s"/>
      </circle>
      <circle cx="118" cy="95" r="7" fill="#fff">
        <animate attributeName="ry" values="7;1;7;7;7" dur="4s" repeatCount="indefinite" begin="1s"/>
      </circle>
      <circle cx="84" cy="93" r="3" fill="#10131f"/>
      <circle cx="120" cy="93" r="3" fill="#10131f"/>
    </g>
    
    <!-- Smile -->
    <path d="M88,118 Q100,128 112,118" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round">
      <animate attributeName="d" values="M88,118 Q100,128 112,118; M88,118 Q100,122 112,118; M88,118 Q100,128 112,118" dur="3s" repeatCount="indefinite"/>
    </path>
    
    <!-- Cheeks -->
    <circle cx="72" cy="110" r="6" fill="#ff6b9d" opacity="0.5"/>
    <circle cx="128" cy="110" r="6" fill="#ff6b9d" opacity="0.5"/>
  </g>
  
  <!-- Sparkles -->
  <g>
    <circle cx="40" cy="60" r="3" fill="#792BFF">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="80" r="3" fill="#2867FF">
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="r" values="2;4;2" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="150" cy="150" r="2" fill="#4f8cff">
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite" begin="1s"/>
    </circle>
  </g>
</svg>
